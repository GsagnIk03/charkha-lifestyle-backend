AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Atelier — serverless stack built entirely on AWS's permanent Always Free
  allowances (no EC2, no RDS, no API Gateway). See the architecture
  blueprint for the reasoning:
  https://claude.ai/code/artifact/12f6ab68-e085-4a6e-a121-054fd3b25b0a

  DynamoDB tables use PROVISIONED billing (not on-demand) on purpose —
  on-demand mode has no free tier at all. Provisioned capacity across the
  three tables here totals 15 RCU / 15 WCU, comfortably under the 25/25
  free allowance shared per account per region. Traffic beyond that
  throttles rather than bills — a deliberate trade-off for a hard $0
  ceiling at MVP scale.

Parameters:
  Stage:
    Type: String
    Default: dev
  AllowedOrigin:
    Type: String
    Description: The frontend's CloudFront URL (or custom domain). Update after the FrontendDistribution is created.
    Default: "http://localhost:5173"
  GoogleClientId:
    Type: String
    Description: OAuth client ID from Google Cloud Console (Credentials > OAuth 2.0 Client ID). Leave blank to skip Google sign-in for now.
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  RazorpayKeyId:
    Type: String
    Default: ""
  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: ""

Conditions:
  HasGoogleIdp: !Not [!Equals [!Ref GoogleClientId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        INVENTORY_REQUESTS_TABLE: !Ref InventoryChangeRequestsTable
        ORDERS_TABLE: !Ref OrdersTable
        ALLOWED_ORIGINS: !Ref AllowedOrigin
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret

Resources:

  # ---------- Compute ----------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda_handler.handler
      FunctionUrlConfig:
        AuthType: NONE   # auth is enforced inside FastAPI via Cognito JWT bearer tokens, not at the URL level
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
          AllowHeaders: ["content-type", "authorization"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryChangeRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ProductsTable.Arn
                - !GetAtt InventoryChangeRequestsTable.Arn

  # ---------- Database (provisioned, not on-demand — see the note at the top) ----------

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Atelier-Products-${Stage}"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH

  InventoryChangeRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Atelier-InventoryChangeRequests-${Stage}"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Atelier-Orders-${Stage}"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH

  # ---------- Auth ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "atelier-${Stage}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolOwnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: owners
      Description: Members can approve/reject inventory change requests. Add the store owner's account here manually after signup.

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "atelier-${AWS::AccountId}"

  # Google sign-in is optional at deploy time — only created if GoogleClientId
  # is supplied. Get these from Google Cloud Console > APIs & Services >
  # Credentials, with the Cognito domain's redirect URI
  # (https://<UserPoolDomain>.auth.<region>.amazoncognito.com/oauth2/idpresponse)
  # registered there first.
  UserPoolIdentityProviderGoogle:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleIdp
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "atelier-web-${Stage}"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: !If
        - HasGoogleIdp
        - [COGNITO, Google]
        - [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Ref AllowedOrigin
      LogoutURLs:
        - !Ref AllowedOrigin

  # ---------- Frontend hosting ----------

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "atelier-frontend-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "atelier-frontend-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        # React Router uses client-side routing — any path CloudFront can't
        # find in the bucket should still serve index.html so the SPA's own
        # router can take over.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: frontend-s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed "CachingOptimized"

  # ---------- Product media ----------

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "atelier-media-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ["*"]

  MediaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "atelier-media-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}"

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: media-s3-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref MediaOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: media-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # ---------- Spend trip-wire ----------
  # NOTE: this alarm only fires if "Receive Billing Alerts" is turned on
  # under Billing Preferences in the AWS Console — that one toggle can't be
  # set via CloudFormation. Turn it on once, manually, right after account
  # creation (see infra/README.md).

  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "atelier-billing-alerts-${Stage}"

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "atelier-spend-over-1-usd-${Stage}"
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref BillingAlarmTopic

Outputs:
  ApiFunctionUrl:
    Description: Base URL for the backend API — set as VITE_API_BASE_URL in the frontend.
    Value: !GetAtt ApiFunction.FunctionUrl
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  MediaUrl:
    Value: !Sub "https://${MediaDistribution.DomainName}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolHostedUiDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
